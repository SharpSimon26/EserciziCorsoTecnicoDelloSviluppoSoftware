services:
  postgres:
    build: .
    image: postgres:18-ita
    container_name: postgres-server
    restart: unless-stopped
    shm_size: 128mb
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--locale=it_IT.UTF-8 --auth=scram-sha-256
    networks:
      - postgres_network
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - postgres_network
    ports:
      - "127.0.0.1:8081:8080"

networks:
  postgres_network:
    name: postgres_network

volumes:
  postgres_data:
    name: postgresql-data